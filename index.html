<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sách giáo khoa điện tử: Nguyên lý Tiếp thị</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            }
        };
    </script>
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #1e293b; }
        .text-body { line-height: 1.7; }

        /* Các class tương tác dùng chung cho mọi chương */
        .process-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease-out, opacity 0.3s, padding 0.3s; opacity: 0; }
        .process-content.active { max-height: 2000px; opacity: 1; padding-top: 1rem; padding-bottom: 1rem; }
        .flip-card { background-color: transparent; perspective: 1000px; cursor: pointer; }
        .flip-card-inner { position: relative; width: 100%; height: 100%; text-align: center; transition: transform 0.6s; transform-style: preserve-3d; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); border-radius: 0.75rem; }
        .flip-card.is-flipped .flip-card-inner { transform: rotateY(180deg); }
        .flip-card-front, .flip-card-back { position: absolute; width: 100%; height: 100%; -webkit-backface-visibility: hidden; backface-visibility: hidden; border-radius: 0.75rem; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 1.5rem; }
        .flip-card-back { transform: rotateY(180deg); }
        @keyframes float { 0% { transform: translateY(0px); } 50% { transform: translateY(-10px); } 100% { transform: translateY(0px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .matrix-quadrant { transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
        .matrix-quadrant:hover { transform: scale(1.02); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); z-index: 20; }
        .tab-btn-ch4 { cursor: pointer; transition: all 0.3s ease; }
        .tab-btn-ch4.active { border-bottom-color: #4f46e5; color: #4f46e5; font-weight: 700; background-color: #eef2ff; }
        .tab-pane-ch4 { display: none; }
        .tab-pane-ch4.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="antialiased pb-20">

    <header class="bg-indigo-900 text-white pt-16 pb-12 px-6 sm:px-12 lg:px-24">
        <div class="max-w-5xl mx-auto">
            <p class="text-indigo-200 font-semibold tracking-wider text-sm uppercase mb-3">Sách giáo khoa điện tử chuẩn mực</p>
            <h1 class="text-3xl sm:text-4xl lg:text-5xl font-bold leading-tight mb-4 !text-white">PRINCIPLES OF MARKETING</h1>
            <p class="text-indigo-100 text-lg max-w-3xl border-l-4 border-indigo-400 pl-4 py-1">Giáo trình: Kotler & Armstrong (17th Edition)</p>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-6 sm:px-12 -mt-6 relative z-10">
        
        <!-- Thanh Điều Hướng (Hỗ trợ cuộn ngang cho 20 chương) -->
        <nav class="flex border-b border-slate-200 mb-8 bg-white rounded-t-xl shadow-sm overflow-x-auto whitespace-nowrap scrollbar-thin scroll-smooth" id="nav-container">
            <!-- Tự động sinh nút thông qua JS -->
        </nav>

        <!-- KHU VỰC HIỂN THỊ NỘI DUNG ĐỘNG -->
        <div id="content-area" class="w-full transition-opacity duration-300">
            <div class="text-center p-10 text-slate-500">
                <i class="fas fa-spinner fa-spin fa-2x mb-3 text-indigo-500"></i><br>Đang tải bài học...
            </div>
        </div>

    </main>

    <!-- Toàn bộ JavaScript dùng chung -->
    <script>
        // 1. Tạo 20 nút điều hướng
        const navContainer = document.getElementById('nav-container');
        for (let i = 1; i <= 20; i++) {
            const btn = document.createElement('button');
            btn.id = `tab-ch-${i}`;
            btn.className = `chapter-tab py-4 px-6 font-medium text-slate-500 border-b-4 border-transparent hover:text-indigo-600 hover:bg-slate-50 transition-all text-sm sm:text-base outline-none shrink-0`;
            btn.innerHTML = `Chương ${i}`;
            btn.onclick = () => loadChapter(i);
            navContainer.appendChild(btn);
        }

        // 2. Hàm Tải Trang Động (Linh hồn của hệ thống)
        async function loadChapter(chNum) {
            const contentArea = document.getElementById('content-area');
            
            // Xử lý Giao diện Nút
            document.querySelectorAll('.chapter-tab').forEach(btn => {
                btn.classList.remove('text-indigo-700', 'font-bold', 'border-indigo-600', 'bg-indigo-50');
                btn.classList.add('text-slate-500', 'font-medium', 'border-transparent');
            });
            const activeBtn = document.getElementById(`tab-ch-${chNum}`);
            if(activeBtn) activeBtn.classList.add('text-indigo-700', 'font-bold', 'border-indigo-600', 'bg-indigo-50', 'text-slate-500', 'font-medium', 'border-transparent');

            // Gọi API Fetch file HTML tương ứng
            try {
                contentArea.style.opacity = 0; // Hiệu ứng mờ dần
                
                const response = await fetch(`chapters/ch${chNum}.html`);
                if (!response.ok) throw new Error("Bài học này đang được biên soạn. Quý sinh viên vui lòng quay lại sau!");
                
                const htmlContent = await response.text();
                contentArea.innerHTML = htmlContent;
                contentArea.style.opacity = 1; // Hiệu ứng hiện ra

                // Chạy lại MathJax để render công thức
                if(window.MathJax) { MathJax.typesetPromise(); }

            } catch (error) {
                contentArea.style.opacity = 1;
                contentArea.innerHTML = `
                    <div class="bg-white rounded-xl shadow-md p-10 text-center border border-slate-100">
                        <i class="fas fa-tools text-4xl text-slate-300 mb-4"></i>
                        <h3 class="text-xl font-bold text-slate-700">${error.message}</h3>
                    </div>`;
            }
        }

        // Tải chương 1 mặc định khi mới vào web
        window.onload = () => loadChapter(1);


        // ==============================================================
        // TẤT CẢ CÁC HÀM TIỆN ÍCH (QUIZ, ACCORDION...) ĐỂ Ở ĐÂY
        // ==============================================================
        function toggleProcess(stepNumber) {
            const allContents = document.querySelectorAll('.process-content');
            const allBtns = document.querySelectorAll('[id^="step-btn-"]');
            const targetContent = document.getElementById(`process-desc-${stepNumber}`);
            const targetBtn = document.getElementById(`step-btn-${stepNumber}`);
            if(!targetContent) return;

            allContents.forEach(el => el.classList.remove('active'));
            allBtns.forEach(btn => {
                btn.classList.remove('ring-4', 'ring-offset-2');
                if (btn.id === 'step-btn-5') btn.classList.add('ring-amber-300');
                else btn.classList.add('ring-teal-300');
            });
            targetContent.classList.add('active');
            targetBtn.classList.add('ring-4', 'ring-offset-2');
        }

        function toggleCh4Step(step) {
            const detailBlock = document.getElementById('ch4-step-detail-1');
            if(!detailBlock) return;
            if(step === 1) {
                if(detailBlock.classList.contains('hidden')) {
                    detailBlock.classList.remove('hidden');
                    detailBlock.classList.add('block', 'animate-[fadeIn_0.3s_ease-in]');
                } else {
                    detailBlock.classList.add('hidden');
                    detailBlock.classList.remove('block');
                }
            } else {
                detailBlock.classList.add('hidden');
            }
        }

        function openCh4Tab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tab-pane-ch4");
            for (i = 0; i < tabcontent.length; i++) tabcontent[i].classList.remove("active");
            tablinks = document.getElementsByClassName("tab-btn-ch4");
            for (i = 0; i < tablinks.length; i++) tablinks[i].classList.remove("active");
            document.getElementById(tabName).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function handleQuiz(qName, correctVal, successMsg, failMsg, resultBoxId) {
            const selected = document.querySelector(`input[name="${qName}"]:checked`);
            const resultBox = document.getElementById(resultBoxId);
            if(!resultBox) return;
            
            resultBox.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'border-emerald-200', 'bg-red-100', 'text-red-800', 'border-red-200');
            
            if (!selected) { alert("Vui lòng chọn đáp án!"); return; }
            
            if (selected.value === correctVal) {
                resultBox.innerHTML = `<strong><i class="fas fa-check-circle mr-1"></i>Đúng!</strong> ${successMsg}`;
                resultBox.classList.add('bg-emerald-100', 'text-emerald-800', 'border', 'border-emerald-200');
            } else {
                resultBox.innerHTML = `<strong><i class="fas fa-times-circle mr-1"></i>Sai.</strong> ${failMsg}`;
                resultBox.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
            }
            resultBox.classList.add('block');
        }
    </script>
</body>
</html>
